<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Socket.IO chat</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      width: 100vw;
      background-color: transparent;
      overflow: hidden;

      > #app {
        display: grid;
        width: 100%;
        height: 100%;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        grid-template-areas: "video";

        > .video {
          width: 100%;
          height: 100%;
          min-width: 0;
          min-height: 0;

          object-fit: contain;
          border-radius: 0;
          background-color: transparent;
          grid-area: video;
          z-index: 1;
        }

        > .title {
          grid-area: video;
          z-index: 2;
          justify-self: center;
          align-self: end;
          margin-bottom: 3rem;

          color: white;
          font-family: 'Impact', sans-serif;
          font-size: 4.5rem;
          font-weight: normal;
          text-align: center;
          background-color: rgba(0, 0, 0, 0.75);
          padding: 0.5rem 1.5rem;
          border-radius: 6px;
          text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }
      }
    }
  </style>
</head>
<body>
<div id="app">

</div>
<script type="module" src="/src/live.ts"></script>
</body>
</html>
